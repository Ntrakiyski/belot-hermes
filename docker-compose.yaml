services:
  belot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      STATIC_DIR: /static
      ENABLE_PRACTICE_BOTS: ${ENABLE_PRACTICE_BOTS:-0}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
